brand_name: "Korean Story"
website_url: "https://koreanstory.com.ua"
# The Mini App behind «⭐ Улюблені» (webapp/index.html, published by
# .github/workflows/pages.yml). Empty means the key stays an ordinary text key
# and opens the favourites screen — which is what it is again: the Mini App is
# the only way a key down there can open the inline list, and it costs a
# webview flashing open and shut on every single press. Tried on 2026-08-24 and
# turned back off for exactly that. The page stays published; this line is the
# whole switch.
webapp_url: ""
# Where webapp/ is served from (.github/workflows/pages.yml). The birthday card
# is webapp/birthday.png, and Telegram fetches a photo by url. Empty means the
# greeting is sent as plain text — the card is decoration, and decoration that
# cannot be reached must not cost a message.
assets_url: "https://halloweex.github.io/ks-tg-bot"
# @korean_story_ua (id 7444906573) — the manager who answers customers.
# Everything a customer sends through "💬 Менеджер", and every discount
# request, lands in this one chat; whoever sits here replies by replying to the
# forwarded message. One id, so moving support means moving it here.
support_chat_id: 7444906573
# The shop's Instagram, from the brand deck's own gift-certificate slide. Shown
# as a button on the contacts page, wearing Instagram's logo. Empty means no
# button — better than a link to an account that may have moved.
instagram_url: "https://instagram.com/korean_story_official"
# Что клиентка получает за приведённую подругу — вашими словами, одной-двумя
# строками. Пусто = экран обещает только то, что бот точно выполнит: «подруга
# закажет — пришлём промокод». Размер скидки бот не выдумывает.
# Пусто — экран обещает ровно то, что бот выполнит сам: «подруга закажет —
# пришлём промокод». Здесь стоит написать размер: «Знижка 10% на наступне
# замовлення» — это обязательство бизнеса, и бот его не выдумывает.
referral_reward: "Знижка 10% на наступне замовлення"
# Код, которым платится реферал. Заводится в админке Shopify (бот кодов не
# создаёт). Пусто — бот честно пишет «менеджер надішле промокод», и выписывает
# его человек. Заполнено — код приходит клиентке сразу, кнопкой со ссылкой,
# которая его применяет.
referral_code: ""
# Скидка новому клиенту на первый заказ. `first_order_code` — код, заведённый
# в админке Shopify (бот его не создаёт, у него нет на это доступа): ссылка
# вида /discount/КОД?redirect=/ применяет его и ведёт в магазин. Пусто — и
# предложение нигде не показывается: кнопка на несуществующий код хуже, чем
# отсутствие кнопки.
first_order_code: ""
first_order_reward: "Знижка 10% на перше замовлення"
# Часы, когда менеджер реально отвечает, по киевскому времени. Вне этих часов
# бот всё так же передаёт сообщение, но пишет клиенту честно: получили, ответим
# с 09:00, — вместо «відповімо тут», которое в три ночи звучит как обещание.
# Оставить пустыми — и бот не обещает никакого срока, как было раньше.
# Меню под полем ввода. false — и меню остаётся только кнопками в сообщении:
# пропадает ☰ в строке ввода и подсказка в поле, но возвращается синяя кнопка
# команд, которую reply-клавиатура собой закрывает. Клавиатуры, уже лежащие у
# людей на экране, снимаются при первом же ответе бота.
bottom_menu: false
support_hours_from: "09:00"
support_hours_to: "21:00"
# Telegram кеширует превью по URL надолго. Поменяли картинку в webapp/ —
# поднимите число, иначе у всех останется старая.
assets_version: "2"

# Info pages — text shown in Phase 3 menus
