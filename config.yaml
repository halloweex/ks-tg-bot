about_text: |
  <b>🌸 Про нас</b>

  <i>A light on K-Beauty. Проливаємо світло на корейський догляд.</i>

  Ми не просто продаємо корейську косметику — пояснюємо її та робимо зрозумілою й близькою у щоденному житті. Підбираємо догляд під людину та її лайфстайл, а не навпаки.

  K-beauty живе не лише у ванній кімнаті: у кав'ярні, у спортзалі, у подорожі, у звичайному вечорі вдома.

  <b>You First. Beauty Second.</b>
contacts_text: |
  <b>📞 Контакти</b>

  Найшвидше — написати сюди ж: «💬 Менеджер» у меню, відповідає людина.

  Сайт: koreanstory.com.ua
  Самовивіз: м. Луцьк
# Sent with parse_mode=HTML like every other screen, hence the tags. The bold
# first line is what every screen in this bot opens with.
#
# `|` keeps every newline exactly as typed, so a paragraph stays on one line
# here however long it gets: wrapping it in this file wraps it on the phone.
#
# <tg-emoji> is the carrier's real logo, drawn inline. It falls back to the 🚚
# inside it wherever it cannot be drawn, and the outgoing middleware strips the
# tag if Telegram ever refuses it — see core/texts.py.
