# Publishes webapp/ to GitHub Pages — one page, and the bot's «⭐ Улюблені» key
# points at it. See webapp/index.html for what it is and why it has to exist.
name: Publish the Mini App

on:
  push:
    branches: [master]
    paths:
      - 'webapp/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Pages allows one deployment at a time; let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement: the action defaults to "assume Pages is already on" and
      # fails with a bare 404 when it is not. Turning it on from here is the
      # only way it gets turned on at all in this repository — a fine-grained
      # PAT cannot write the Pages settings, the workflow's own token can.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp
      - id: deploy
        uses: actions/deploy-pages@v4
