name: Deploy to server

on:
  push:
    branches: [master]
    # Skip deploys for docs/planning-only changes.
    paths-ignore:
      - '**.md'
      - '.planning/**'
  workflow_dispatch:

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Build here, not on the production host. Building there meant a failed build
  # took the bot down with no previous tag to return to, because the image was
  # always rebuilt under the same name.
  build:
    # arm64 runner, because the server is arm64 — the first GHCR deploy failed
    # with "no matching manifest for linux/arm64/v8". Building natively rather
    # than cross-building under QEMU: this repository is public, so GitHub's
    # arm runners cost nothing, and emulated pip installs are minutes slower.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # docs/architecture.md §3 names this step as what holds the boundary, and
      # until now the step did not exist — the rule was held by nobody having
      # broken it. One reader of the environment is what makes a missing
      # variable one loud error at startup instead of a default applied quietly
      # three modules deep.
      #
      # The neighbouring invariant in that table — proactive sending only from
      # `worker` — deliberately has no step here: there is no worker yet, and
      # bot/stock.py and bot/sync.py send on purpose (docs/incremental-sync.md).
      # A grep that has to be listed around five legitimate files proves
      # nothing; it goes in with the container.
      - name: os.environ is read in core/config.py and nowhere else
        run: |
          hits=$(grep -rn --include='*.py' -E 'os\.(environ|getenv)' bot core \
                 | grep -v '^core/config\.py:' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::os.environ belongs in core/config.py — docs/architecture.md §3"
            exit 1
          fi

      # CLAUDE.md requires both of these before a commit, and until now that
      # was the whole of the enforcement: a push where somebody skipped the
      # local run deployed untested. Ten seconds here against a bot that is
      # down until somebody notices.
      #
      # Before the build rather than after, so a red suite costs a minute of
      # CI rather than a pushed image nobody wants.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests and the layering contracts
        run: |
          python -m pip install --quiet -r requirements-dev.txt
          python -m pytest -q
          lint-imports --config .importlinter

      - id: meta
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          # Two tags on purpose: the sha is what actually runs and what a
          # rollback names; latest is only a convenience for a manual pull.
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      # The image, not the source tree. A module that moved without being added
      # to the Dockerfile imports fine in CI and dies inside the container, and
      # the only thing that catches it is running the image itself.
      - name: Import the entrypoint inside the built image
        run: |
          docker run --rm --entrypoint python \
            "${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}" \
            -c "import bot.__main__; print('entrypoint imports')"

      # The step above does NOT read config.yaml: load_config() is called
      # inside main(), so importing the entrypoint never opens the file. A
      # broken indent in the one file the owner edits by hand therefore passed
      # every check here and took the bot down at the next restart — which can
      # be hours later, on somebody else's deploy, with nothing pointing back
      # at the edit that caused it.
      #
      # Inside the image and not on the runner, because that is where the file
      # will actually be read, by that Python and those dependencies.
      #
      # The two dummy secrets are not laziness. `load_config` builds
      # `EnvSettings` as well as reading the YAML, and BOT_TOKEN and
      # KEYCRM_API_KEY are required fields — without them this step fails on the
      # secrets instead of on the file it is here to check, which is exactly
      # what it did on its first run. Nothing here connects to anything; the
      # values only have to exist.
      - name: The config the owner edits actually loads
        run: |
          docker run --rm --entrypoint python \
            -e BOT_TOKEN=ci -e KEYCRM_API_KEY=ci \
            "${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}" \
            -c "from core.config import load_config; load_config(); print('config loads')"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Only what the server runs from. The application code now arrives inside
      # the image, so syncing it too would let the files on disk drift away from
      # the running container and mean nothing.
      - name: Sync compose and deploy scripts
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude 'backup.env' \
            docker-compose.yml deploy \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/ks-tg-bot/"

      - name: Pull and restart
        env:
          TAG: ${{ needs.build.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "IMAGE='${{ env.IMAGE }}' TAG='$TAG' GH_TOKEN='$GH_TOKEN' GH_ACTOR='$GH_ACTOR' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/ks-tg-bot

          # The login persists in ~/.docker/config.json, so a later manual pull
          # for a rollback works without going back to Actions for a token.
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

          docker pull "$IMAGE:$TAG"

          # Pin the running version in .env so it survives a bare `up -d` and a
          # reboot. Without this a rollback would silently jump back to latest
          # the next time anyone ran compose by hand.
          if grep -q '^IMAGE_TAG=' .env; then
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$TAG|" .env
          else
            printf '\nIMAGE_TAG=%s\n' "$TAG" >> .env
          fi

          # Sequential by construction: one replica, so compose stops the old
          # container before starting the new one. Two overlapping long-pollers
          # on one token give the second a 409 from Telegram, and nothing in the
          # code handles it. Do not scale this service.
          docker compose up -d --remove-orphans
          docker compose ps
          REMOTE

      - name: Health check
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            cd /opt/ks-tg-bot
            sleep 5
            status=$(docker inspect -f "{{.State.Status}}" ks-tg-bot)
            echo "container status: $status"
            docker compose logs --tail 30
            [ "$status" = "running" ] || { echo "::error::container not running"; exit 1; }
            # The line the bot prints once startup finished. Status alone only
            # says the process exists; it can be five seconds away from dying on
            # a failed migration.
            docker compose logs --tail 100 | grep -q "Bot started successfully" \
              || { echo "::error::startup never completed"; exit 1; }
          '

      - name: How to roll back
        if: failure()
        run: |
          echo "::error::Deploy failed. On the server:"
          echo "  cd /opt/ks-tg-bot && IMAGE_TAG=<previous-sha-tag> docker compose up -d"
          echo "  previous tags: docker images ${{ env.IMAGE }} --format '{{.Tag}}'"
          echo "See deploy/README.md."
