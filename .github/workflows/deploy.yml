name: Deploy to server

on:
  push:
    branches: [master]
    # Skip deploys for docs/planning-only changes.
    paths-ignore:
      - '**.md'
      - '.planning/**'
  workflow_dispatch:

# Never run two deploys at once; let an in-flight one finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Sync code to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude '.git' --exclude '.github' --exclude '.venv' \
            --exclude '__pycache__' --exclude '*.pyc' \
            --exclude '.env' --exclude 'data' --exclude 'backups' \
            --exclude 'deploy/backup.env' \
            --exclude '*.db' --exclude '*.db-wal' --exclude '*.db-shm' \
            --exclude '.planning' \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/ks-tg-bot/"

      - name: Build & restart container
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'cd /opt/ks-tg-bot && docker compose up -d --build && docker compose ps'

      - name: Health check
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" '
            set -e
            cd /opt/ks-tg-bot
            sleep 5
            status=$(docker inspect -f "{{.State.Status}}" ks-tg-bot)
            echo "container status: $status"
            docker compose logs --tail 20
            [ "$status" = "running" ] || { echo "::error::container not running"; exit 1; }
          '
