# Alembic, for Postgres only. The SQLite schema does not enter this history —
# docs/architecture.md §10 — so revision 001 is the target schema written by
# hand, not a capture of what SQLite happens to hold today.
#
# Offline rendering, which is how a revision is reviewed before any database
# exists:
#
#   .venv/bin/alembic upgrade head --sql
#
# The URL is read from the environment at runtime (see migrations/env.py), so
# nothing here carries a credential.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Left empty on purpose: env.py takes it from DATABASE_URL, and a default here
# would be a live database somebody runs a migration against by accident.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
